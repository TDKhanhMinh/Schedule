apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schedule-api
  template:
    metadata:
      labels:
        app: schedule-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/schedule-api:0.1.0
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: schedule-config
            - secretRef:
                name: schedule-runtime
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: schedule-api
spec:
  selector:
    app: schedule-api
  ports:
    - name: http
      port: 3000
      targetPort: http

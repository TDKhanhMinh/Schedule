services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "55432:5432"
    volumes:
      - scheduler-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - scheduler-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
    command: ["node", "backend/database/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3011:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://scheduler:scheduler@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379
      SOLVER_ROOT: /app/backend/solver
      SOLVER_PYTHON: /usr/local/bin/python
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  scheduler-postgres:
  scheduler-redis:

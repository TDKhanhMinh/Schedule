[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-solver"
version = "0.1.0"
description = "CP-SAT solver boundary for School Timetable Optimizer"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10,<10",
  "pydantic>=2.7,<3"
]

[project.scripts]
schedule-solver = "timetable_solver.main:main"

[tool.setuptools.packages.find]
where = ["src"]

